<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CRUD Productos - Fetch + PHP OOP + MySQL</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f1f4f9; }
        .encabezado {
            background: linear-gradient(135deg, #4b1d6b, #1f6f43);
            color: #fff;
            padding: 26px 0;
            margin-bottom: 28px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
        }
        .encabezado h1 { font-size: 1.7rem; margin: 0; }
        .encabezado p  { margin: 4px 0 0; opacity: .85; }
        .tarjeta { border: 0; border-radius: 14px; box-shadow: 0 4px 14px rgba(0, 0, 0, .08); }
        .tarjeta .card-header { border-radius: 14px 14px 0 0 !important; font-weight: 600; font-size: 1.1rem; }
        .modo-edicion .card-header { background: #fff3cd; }
        .input-group-text { min-width: 92px; }
        .sin-stock { color: #dc3545; font-weight: 600; }
        table td, table th { vertical-align: middle; }
    </style>
</head>
<body>

    <header class="encabezado">
        <div class="container">
            <h1>CRUD de Productos</h1>
            <p>Guardar, Editar y Buscar con Fetch API, PHP OOP y MySQL</p>
        </div>
    </header>

    <main class="container pb-5">
        <div class="row g-4">

            <!-- ====== FORMULARIO ====== -->
            <div class="col-lg-4">
                <div class="card tarjeta" id="tarjetaForm">
                    <div class="card-header bg-light" id="tituloForm">Productos</div>
                    <div class="card-body">
                        <h5 class="card-title" id="subtituloForm">Formulario para Agregar Productos</h5>

                        <!-- Alert de Bootstrap: aquí se listan los errores de validación -->
                        <div id="alertaForm" class="alert alert-danger d-none mt-3" role="alert"></div>

                        <form method="post" id="frm" novalidate class="mt-3">
                            <!-- Acción actual (Guardar / Modificar) y id del producto en edición -->
                            <input type="hidden" name="Accion" id="Accion" value="Guardar">
                            <input type="hidden" name="idp" id="idp" value="">

                            <div class="input-group mb-3">
                                <span class="input-group-text">Código</span>
                                <input class="form-control" type="text" name="Codigo" id="Codigo" maxlength="20" placeholder="Código">
                            </div>

                            <div class="input-group mb-3">
                                <span class="input-group-text">Producto</span>
                                <input class="form-control" type="text" name="Producto" id="Producto" maxlength="100" placeholder="Producto">
                            </div>

                            <div class="input-group mb-3">
                                <span class="input-group-text">Precio</span>
                                <input class="form-control" type="number" step="0.01" min="0.01" name="Precio" id="Precio" placeholder="Precio">
                            </div>

                            <div class="input-group mb-4">
                                <span class="input-group-text">Cantidad</span>
                                <!-- min="0": el mismo formulario sirve para Guardar y Modificar (producto agotado).
                                     La regla "mínimo 1 al guardar" se valida en JS y en PHP. -->
                                <input class="form-control" type="number" step="1" min="0" name="Cantidad" id="Cantidad" placeholder="Cantidad">
                            </div>

                            <div class="d-flex gap-2">
                                <input type="submit" class="btn btn-outline-success" id="Registrar" value="Registrar">
                                <button type="button" class="btn btn-outline-secondary d-none" id="btnCancelar">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- ====== BÚSQUEDA + TABLA ====== -->
            <div class="col-lg-8">
                <input type="text" class="form-control mb-3" id="txtBuscar" placeholder="Buscar producto..." autocomplete="off">

                <div class="table-responsive">
                    <table class="table table-hover table-responsive align-middle bg-white">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Codigo</th>
                                <th>Descripcion</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Editar</th>
                                <th>Eliminar</th>
                            </tr>
                        </thead>
                        <!-- listar.php inserta aquí las filas -->
                        <tbody id="resultado"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/script.js"></script>
</body>
</html>
